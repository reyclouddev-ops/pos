<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ReyCloud — Public Chat</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    min-height:100vh;
    background:#f7f8fa;
    color:#111827;
}

.app{
    min-height:100vh;
    display:flex;
}

/* SIDEBAR */

.sidebar{
    width:250px;
    background:#fff;
    border-right:1px solid #e5e7eb;
    padding:22px 16px;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    z-index:20;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    padding:5px 10px 28px;
}

.logo-icon{
    width:36px;
    height:36px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#111827;
    color:#fff;
    font-weight:800;
}

.logo-text{
    font-size:18px;
    font-weight:800;
    letter-spacing:-.5px;
}

.logo-text span{
    color:#6b7280;
}

.nav-title{
    font-size:11px;
    font-weight:700;
    color:#9ca3af;
    padding:0 10px;
    margin:8px 0 10px;
    text-transform:uppercase;
    letter-spacing:.08em;
}

.nav{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.nav a{
    text-decoration:none;
    color:#6b7280;
    padding:11px 12px;
    border-radius:9px;
    display:flex;
    align-items:center;
    gap:11px;
    font-size:14px;
    font-weight:600;
    transition:.2s;
}

.nav a:hover{
    background:#f3f4f6;
    color:#111827;
}

.nav a.active{
    background:#111827;
    color:#fff;
}

.sidebar-user{
    position:absolute;
    left:16px;
    right:16px;
    bottom:18px;
    border-top:1px solid #e5e7eb;
    padding-top:15px;
}

.user-mini{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:36px;
    height:36px;
    border-radius:50%;
    background:#111827;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:13px;
}

.user-info{
    min-width:0;
}

.user-info strong{
    display:block;
    font-size:13px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.user-info span{
    display:block;
    color:#9ca3af;
    font-size:11px;
    margin-top:2px;
}

/* MAIN */

.main{
    width:calc(100% - 250px);
    margin-left:250px;
    min-height:100vh;
}

.topbar{
    height:68px;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(12px);
    border-bottom:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    position:sticky;
    top:0;
    z-index:10;
}

.page-title{
    font-size:16px;
    font-weight:750;
}

.status{
    display:flex;
    align-items:center;
    gap:7px;
    color:#6b7280;
    font-size:12px;
}

.status-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 0 3px #dcfce7;
}

.content{
    max-width:1050px;
    margin:auto;
    padding:30px;
}

/* HEADER */

.chat-header{
    background:#111827;
    color:white;
    border-radius:16px;
    padding:26px;
    margin-bottom:18px;
    position:relative;
    overflow:hidden;
}

.chat-header::before{
    content:"";
    position:absolute;
    width:220px;
    height:220px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:50%;
    right:-80px;
    top:-100px;
}

.chat-header::after{
    content:"";
    position:absolute;
    width:140px;
    height:140px;
    border:1px solid rgba(255,255,255,.06);
    border-radius:50%;
    right:50px;
    bottom:-100px;
}

.chat-header h1{
    position:relative;
    z-index:1;
    font-size:25px;
    letter-spacing:-.7px;
}

.chat-header p{
    position:relative;
    z-index:1;
    color:#9ca3af;
    font-size:13px;
    margin-top:7px;
}

/* CHAT */

.chat-box{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:16px;
    overflow:hidden;
    height:calc(100vh - 250px);
    min-height:470px;
    display:flex;
    flex-direction:column;
}

.chat-top{
    padding:15px 18px;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.chat-top-left{
    display:flex;
    align-items:center;
    gap:10px;
}

.chat-icon{
    width:34px;
    height:34px;
    border-radius:9px;
    background:#f3f4f6;
    display:flex;
    align-items:center;
    justify-content:center;
}

.chat-top strong{
    font-size:14px;
}

.chat-top small{
    display:block;
    color:#9ca3af;
    font-size:11px;
    margin-top:2px;
}

.refresh-btn{
    border:1px solid #e5e7eb;
    background:#fff;
    border-radius:8px;
    padding:7px 10px;
    cursor:pointer;
    font-size:12px;
    color:#4b5563;
}

.refresh-btn:hover{
    background:#f9fafb;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:15px;
    background:#fafafa;
}

.empty{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    color:#9ca3af;
    text-align:center;
}

.empty-icon{
    width:52px;
    height:52px;
    background:#f3f4f6;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:10px;
    font-size:21px;
}

.empty strong{
    color:#6b7280;
    font-size:14px;
}

.empty p{
    font-size:12px;
    margin-top:4px;
}

/* MESSAGE */

.message{
    display:flex;
    gap:10px;
    max-width:80%;
}

.message.mine{
    margin-left:auto;
    flex-direction:row-reverse;
}

.message-avatar{
    flex:0 0 34px;
    width:34px;
    height:34px;
    border-radius:50%;
    background:#111827;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:800;
}

.message.mine .message-avatar{
    background:#374151;
}

.message-content{
    min-width:0;
}

.message-meta{
    display:flex;
    align-items:center;
    gap:7px;
    margin-bottom:4px;
}

.message.mine .message-meta{
    justify-content:flex-end;
}

.message-name{
    font-size:12px;
    font-weight:750;
    color:#374151;
}

.role{
    font-size:9px;
    padding:2px 6px;
    border-radius:20px;
    background:#f3f4f6;
    color:#6b7280;
    font-weight:700;
}

.message-time{
    color:#9ca3af;
    font-size:9px;
}

.bubble{
    background:#fff;
    border:1px solid #e5e7eb;
    padding:9px 12px;
    border-radius:11px;
    color:#374151;
    font-size:13px;
    line-height:1.5;
    word-break:break-word;
}

.message.mine .bubble{
    background:#111827;
    border-color:#111827;
    color:#fff;
}

/* INPUT */

.chat-input{
    padding:13px;
    border-top:1px solid #e5e7eb;
    background:#fff;
}

.input-wrap{
    display:flex;
    gap:8px;
}

.input-wrap input{
    flex:1;
    border:1px solid #e5e7eb;
    outline:none;
    border-radius:10px;
    padding:12px 13px;
    font-size:13px;
    color:#111827;
    background:#fafafa;
    transition:.2s;
}

.input-wrap input:focus{
    border-color:#9ca3af;
    background:#fff;
    box-shadow:0 0 0 3px #f3f4f6;
}

.send-btn{
    width:45px;
    border:0;
    border-radius:10px;
    background:#111827;
    color:#fff;
    cursor:pointer;
    font-size:16px;
    transition:.2s;
}

.send-btn:hover{
    background:#374151;
}

.send-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.input-info{
    display:flex;
    justify-content:space-between;
    margin-top:7px;
    padding:0 3px;
    color:#9ca3af;
    font-size:10px;
}

/* MOBILE */

.mobile-menu{
    display:none;
    border:0;
    background:#f3f4f6;
    width:35px;
    height:35px;
    border-radius:8px;
    cursor:pointer;
}

@media(max-width:800px){

    .sidebar{
        transform:translateX(-100%);
        transition:.25s;
        box-shadow:10px 0 30px rgba(0,0,0,.08);
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .main{
        width:100%;
        margin-left:0;
    }

    .mobile-menu{
        display:block;
    }

    .topbar{
        padding:0 15px;
    }

    .content{
        padding:15px;
    }

    .chat-header{
        padding:21px;
    }

    .chat-header h1{
        font-size:21px;
    }

    .chat-box{
        height:calc(100vh - 225px);
        min-height:450px;
    }

    .message{
        max-width:92%;
    }
}

@media(max-width:480px){

    .status{
        display:none;
    }

    .content{
        padding:10px;
    }

    .chat-header{
        border-radius:13px;
    }

    .chat-box{
        border-radius:13px;
    }

    .messages{
        padding:14px;
    }

    .message{
        max-width:96%;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar" id="sidebar">

        <div class="logo">
            <div class="logo-icon">R</div>
            <div class="logo-text">
                ReyCloud <span>Panel</span>
            </div>
        </div>

        <div class="nav-title">Menu</div>

        <nav class="nav">

            <a href="dashboard.html">
                <span>⌂</span>
                Dashboard
            </a>

            <a href="cpanel.html">
                <span>▣</span>
                Create Panel
            </a>

            <a href="cadmin.html">
                <span>♙</span>
                Create Admin
            </a>

            <a href="chat.html" class="active">
                <span>◉</span>
                Public Chat
            </a>

        </nav>

        <div class="sidebar-user">
            <div class="user-mini">
                <div class="avatar" id="sidebarAvatar">R</div>

                <div class="user-info">
                    <strong id="sidebarUsername">
                        User
                    </strong>

                    <span id="sidebarRole">
                        member
                    </span>
                </div>
            </div>
        </div>

    </aside>


    <main class="main">

        <header class="topbar">

            <div style="display:flex;align-items:center;gap:10px">

                <button
                    class="mobile-menu"
                    id="mobileMenu"
                    type="button"
                >
                    ☰
                </button>

                <div class="page-title">
                    Public Chat
                </div>

            </div>

            <div class="status">
                <span class="status-dot"></span>
                API Connected
            </div>

        </header>


        <section class="content">

            <div class="chat-header">
                <h1>💬 Public Chat</h1>
                <p>
                    Ngobrol bersama pengguna ReyCloud lainnya.
                </p>
            </div>


            <div class="chat-box">

                <div class="chat-top">

                    <div class="chat-top-left">

                        <div class="chat-icon">
                            💬
                        </div>

                        <div>
                            <strong>
                                ReyCloud Community
                            </strong>

                            <small id="messageCount">
                                Memuat pesan...
                            </small>
                        </div>

                    </div>

                    <button
                        class="refresh-btn"
                        id="refreshBtn"
                    >
                        ↻ Refresh
                    </button>

                </div>


                <div
                    class="messages"
                    id="messages"
                >

                    <div class="empty">
                        <div class="empty-icon">
                            ⏳
                        </div>

                        <strong>
                            Memuat chat...
                        </strong>

                        <p>
                            Tunggu sebentar
                        </p>
                    </div>

                </div>


                <div class="chat-input">

                    <div class="input-wrap">

                        <input
                            type="text"
                            id="messageInput"
                            maxlength="1000"
                            autocomplete="off"
                            placeholder="Tulis pesan..."
                        >

                        <button
                            class="send-btn"
                            id="sendBtn"
                            type="button"
                        >
                            ➤
                        </button>

                    </div>

                    <div class="input-info">

                        <span>
                            Chat publik
                        </span>

                        <span id="charCount">
                            0/1000
                        </span>

                    </div>

                </div>

            </div>

        </section>

    </main>

</div>


<script>
const API_BASE =
    "https://api.legionteknologi.my.id";

const API_CHAT =
    `${API_BASE}/api/chat`;

let currentUser = null;
let loading = false;
let lastMessagesHash = "";


/* =========================
   USER
========================= */

function getUser(){

    try{

        const raw =
            localStorage.getItem("user");

        if(!raw){
            return null;
        }

        const parsed =
            JSON.parse(raw);

        if(parsed?.user){
            return parsed.user;
        }

        return parsed;

    }catch(error){

        console.error(
            "LocalStorage user error:",
            error
        );

        return null;
    }
}


function setupUser(){

    currentUser =
        getUser();

    if(!currentUser){

        alert(
            "Session login tidak ditemukan. Silakan login terlebih dahulu."
        );

        window.location.href =
            "index.html";

        return false;
    }

    const username =
        currentUser.username ||
        "User";

    const role =
        currentUser.role ||
        "member";

    document.getElementById(
        "sidebarUsername"
    ).textContent =
        username;

    document.getElementById(
        "sidebarRole"
    ).textContent =
        role;

    document.getElementById(
        "sidebarAvatar"
    ).textContent =
        username
            .charAt(0)
            .toUpperCase();

    return true;
}


/* =========================
   FORMAT
========================= */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function formatTime(date){

    const d =
        new Date(date);

    if(
        Number.isNaN(
            d.getTime()
        )
    ){
        return "-";
    }

    return d.toLocaleTimeString(
        "id-ID",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}


function formatRole(role){

    return String(
        role || "member"
    )
        .replace(/\b\w/g,c =>
            c.toUpperCase()
        );
}


/* =========================
   LOAD CHAT
========================= */

async function loadMessages(
    forceScroll = false
){

    if(loading){
        return;
    }

    loading = true;

    try{

        const response =
            await fetch(
                API_CHAT,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );

        const data =
            await response.json();

        if(!response.ok ||
            !data.status
        ){
            throw new Error(
                data.message ||
                "Gagal mengambil chat"
            );
        }

        const messages =
            Array.isArray(
                data.result
            )
                ? data.result
                : [];

        const hash =
            JSON.stringify(
                messages
            );

        document.getElementById(
            "messageCount"
        ).textContent =
            `${messages.length} pesan`;

        if(
            hash ===
            lastMessagesHash
        ){

            loading = false;
            return;
        }

        lastMessagesHash =
            hash;

        renderMessages(
            messages,
            forceScroll
        );

    }catch(error){

        console.error(
            "[CHAT GET]",
            error
        );

        document.getElementById(
            "messages"
        ).innerHTML = `
            <div class="empty">
                <div class="empty-icon">
                    ⚠️
                </div>

                <strong>
                    Gagal memuat chat
                </strong>

                <p>
                    ${escapeHTML(
                        error.message
                    )}
                </p>
            </div>
        `;

    }finally{

        loading = false;
    }
}


/* =========================
   RENDER
========================= */

function renderMessages(
    messages,
    forceScroll
){

    const container =
        document.getElementById(
            "messages"
        );

    if(!messages.length){

        container.innerHTML = `
            <div class="empty">
                <div class="empty-icon">
                    💬
                </div>

                <strong>
                    Belum ada pesan
                </strong>

                <p>
                    Jadilah orang pertama yang mengirim pesan.
                </p>
            </div>
        `;

        return;
    }

    const wasBottom =
        container.scrollHeight -
        container.scrollTop -
        container.clientHeight <
        100;

    container.innerHTML =
        messages
            .map(chat => {

                const isMine =
                    String(
                        chat.username || ""
                    ).toLowerCase() ===
                    String(
                        currentUser?.username || ""
                    ).toLowerCase();

                const username =
                    escapeHTML(
                        chat.username ||
                        "User"
                    );

                const role =
                    escapeHTML(
                        formatRole(
                            chat.role
                        )
                    );

                const message =
                    escapeHTML(
                        chat.message
                    );

                const initial =
                    String(
                        chat.username ||
                        "U"
                    )
                        .charAt(0)
                        .toUpperCase();

                return `
                    <div class="message ${
                        isMine
                            ? "mine"
                            : ""
                    }">

                        <div class="message-avatar">
                            ${escapeHTML(initial)}
                        </div>

                        <div class="message-content">

                            <div class="message-meta">

                                <span class="message-name">
                                    ${username}
                                </span>

                                <span class="role">
                                    ${role}
                                </span>

                                <span class="message-time">
                                    ${formatTime(
                                        chat.createdAt
                                    )}
                                </span>

                            </div>

                            <div class="bubble">
                                ${message}
                            </div>

                        </div>

                    </div>
                `;
            })
            .join("");

    if(
        forceScroll ||
        wasBottom
    ){

        requestAnimationFrame(() => {

            container.scrollTop =
                container.scrollHeight;

        });
    }
}


/* =========================
   SEND
========================= */

async function sendMessage(){

    if(!currentUser){
        return;
    }

    const input =
        document.getElementById(
            "messageInput"
        );

    const button =
        document.getElementById(
            "sendBtn"
        );

    const message =
        input.value.trim();

    if(!message){
        return;
    }

    if(message.length > 1000){

        alert(
            "Pesan maksimal 1000 karakter."
        );

        return;
    }

    button.disabled = true;

    try{

        const response =
            await fetch(
                API_CHAT,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            username:
                                currentUser.username,

                            message
                        })
                }
            );

        const data =
            await response.json();

        if(
            !response.ok ||
            !data.status
        ){

            throw new Error(
                data.message ||
                "Gagal mengirim pesan"
            );
        }

        input.value = "";

        updateCharCount();

        lastMessagesHash = "";

        await loadMessages(true);

        input.focus();

    }catch(error){

        console.error(
            "[CHAT POST]",
            error
        );

        alert(
            error.message ||
            "Gagal mengirim pesan."
        );

    }finally{

        button.disabled = false;
    }
}


/* =========================
   CHARACTER COUNT
========================= */

function updateCharCount(){

    const input =
        document.getElementById(
            "messageInput"
        );

    document.getElementById(
        "charCount"
    ).textContent =
        `${input.value.length}/1000`;
}


/* =========================
   EVENTS
========================= */

document.getElementById(
    "sendBtn"
).addEventListener(
    "click",
    sendMessage
);

document.getElementById(
    "messageInput"
).addEventListener(
    "input",
    updateCharCount
);

document.getElementById(
    "messageInput"
).addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();
        }
    }
);

document.getElementById(
    "refreshBtn"
).addEventListener(
    "click",
    () => {

        lastMessagesHash = "";

        loadMessages();
    }
);


/* =========================
   MOBILE MENU
========================= */

document.getElementById(
    "mobileMenu"
).addEventListener(
    "click",
    () => {

        document
            .getElementById("sidebar")
            .classList
            .toggle("open");
    }
);


/* =========================
   INIT
========================= */

if(
    setupUser()
){

    loadMessages(true);

    setInterval(
        () => {
            loadMessages(false);
        },
        3000
    );
}
</script>

</body>
</html>
