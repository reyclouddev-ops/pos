<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ReyCloud — Profile</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    min-height:100vh;
    background:#f7f8fa;
    color:#111827;
}

button,input{
    font-family:inherit;
}

.app{
    min-height:100vh;
    display:flex;
}

.sidebar{
    width:250px;
    background:#fff;
    border-right:1px solid #e5e7eb;
    padding:22px 16px;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    z-index:50;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    padding:5px 10px 28px;
}

.logo-icon{
    width:36px;
    height:36px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#111827;
    color:#fff;
    font-weight:800;
}

.logo-text{
    font-size:18px;
    font-weight:800;
}

.logo-text span{
    color:#6b7280;
}

.nav-title{
    font-size:11px;
    font-weight:700;
    color:#9ca3af;
    padding:0 10px;
    margin:8px 0 10px;
    text-transform:uppercase;
    letter-spacing:.08em;
}

.nav{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.nav a{
    text-decoration:none;
    color:#6b7280;
    padding:11px 12px;
    border-radius:9px;
    display:flex;
    align-items:center;
    gap:11px;
    font-size:14px;
    font-weight:600;
}

.nav a:hover{
    background:#f3f4f6;
    color:#111827;
}

.nav a.active{
    background:#111827;
    color:#fff;
}

.sidebar-user{
    position:absolute;
    left:16px;
    right:16px;
    bottom:18px;
    border-top:1px solid #e5e7eb;
    padding-top:15px;
}

.user-mini{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:36px;
    height:36px;
    border-radius:50%;
    background:#111827;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    overflow:hidden;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.user-info{
    min-width:0;
}

.user-info strong{
    display:block;
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-info span{
    display:block;
    color:#9ca3af;
    font-size:11px;
    margin-top:2px;
}

.main{
    width:calc(100% - 250px);
    margin-left:250px;
    min-height:100vh;
}

.topbar{
    height:68px;
    background:#fff;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
}

.page-title{
    font-size:16px;
    font-weight:750;
}

.mobile-menu{
    display:none;
    border:0;
    background:#f3f4f6;
    width:35px;
    height:35px;
    border-radius:8px;
    cursor:pointer;
}

.content{
    max-width:850px;
    margin:auto;
    padding:30px;
}

.profile-card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:18px;
    overflow:hidden;
}

.cover{
    height:150px;
    background:#111827;
    position:relative;
    overflow:hidden;
}

.cover:after{
    content:"";
    position:absolute;
    width:230px;
    height:230px;
    right:-70px;
    top:-120px;
    border-radius:50%;
    background:rgba(255,255,255,.06);
}

.profile-main{
    padding:0 25px 25px;
    position:relative;
}

.profile-avatar{
    width:110px;
    height:110px;
    border-radius:50%;
    background:#111827;
    border:6px solid #fff;
    margin-top:-55px;
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:35px;
    font-weight:800;
    overflow:hidden;
}

.profile-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.profile-name{
    margin-top:15px;
    font-size:24px;
    font-weight:800;
}

.profile-role{
    display:inline-block;
    margin-top:6px;
    padding:5px 11px;
    background:#f3f4f6;
    color:#6b7280;
    border-radius:20px;
    font-size:11px;
    font-weight:700;
}

.profile-form{
    margin-top:25px;
    border-top:1px solid #e5e7eb;
    padding-top:22px;
}

.form-title{
    font-size:15px;
    font-weight:800;
    margin-bottom:15px;
}

.upload-box{
    border:1px dashed #d1d5db;
    border-radius:14px;
    padding:20px;
    background:#fafafa;
    display:flex;
    align-items:center;
    gap:15px;
}

.upload-preview{
    width:70px;
    height:70px;
    border-radius:50%;
    background:#111827;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:800;
    overflow:hidden;
    flex-shrink:0;
}

.upload-preview img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.upload-info{
    flex:1;
}

.upload-info strong{
    display:block;
    font-size:13px;
}

.upload-info span{
    display:block;
    color:#9ca3af;
    font-size:11px;
    margin-top:4px;
}

.upload-btn{
    border:0;
    background:#111827;
    color:#fff;
    border-radius:9px;
    padding:10px 14px;
    cursor:pointer;
    font-size:12px;
    font-weight:700;
}

.upload-btn:hover{
    opacity:.9;
}

.save-btn{
    width:100%;
    height:45px;
    border:0;
    border-radius:10px;
    background:#111827;
    color:#fff;
    cursor:pointer;
    margin-top:15px;
    font-size:13px;
    font-weight:750;
}

.save-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.status{
    margin-top:12px;
    padding:11px 13px;
    border-radius:9px;
    background:#f3f4f6;
    color:#6b7280;
    font-size:11px;
    display:none;
}

.status.show{
    display:block;
}

.status.success{
    background:#dcfce7;
    color:#166534;
}

.status.error{
    background:#fee2e2;
    color:#991b1b;
}

.info-grid{
    margin-top:25px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.info-box{
    border:1px solid #e5e7eb;
    border-radius:11px;
    padding:14px;
    background:#fafafa;
}

.info-box span{
    display:block;
    color:#9ca3af;
    font-size:10px;
}

.info-box strong{
    display:block;
    margin-top:5px;
    font-size:13px;
}

@media(max-width:800px){

    .sidebar{
        transform:translateX(-100%);
        transition:.25s;
        box-shadow:10px 0 30px rgba(0,0,0,.08);
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .main{
        width:100%;
        margin-left:0;
    }

    .mobile-menu{
        display:block;
    }

    .topbar{
        padding:0 15px;
    }

    .content{
        padding:15px;
    }
}

@media(max-width:500px){

    .content{
        padding:10px;
    }

    .profile-main{
        padding:0 18px 20px;
    }

    .upload-box{
        flex-direction:column;
        text-align:center;
    }

    .info-grid{
        grid-template-columns:1fr;
    }

    .upload-btn{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">

    <div class="logo">
        <div class="logo-icon">R</div>
        <div class="logo-text">
            ReyCloud <span>Panel</span>
        </div>
    </div>

    <div class="nav-title">
        Main
    </div>

    <nav class="nav">

        <a href="dashboard.html">
            <span>⌂</span>
            Dashboard
        </a>

        <a href="profile.html" class="active">
            <span>◉</span>
            Profile
        </a>

        <a href="cpanel.html">
            <span>▣</span>
            Create Panel
        </a>

        <a href="cadmin.html">
            <span>♙</span>
            Create Admin
        </a>

        <a href="chat.html">
            <span>☁</span>
            Public Chat
        </a>

        <a href="privatechat.html">
            <span>✉</span>
            Private Chat
        </a>

    </nav>

    <div class="nav-title">
        Account
    </div>

    <nav class="nav">

        <a href="javascript:void(0)" id="refreshAccount">
            <span>↻</span>
            Refresh Data
        </a>

        <a href="javascript:void(0)" id="logoutButton">
            <span>↪</span>

        </a>

    </nav>

    <div class="sidebar-user">

        <div class="user-mini">

            <div class="avatar" id="sidebarAvatar">
                U
            </div>

            <div class="user-info">

                <strong id="sidebarUsername">
                    User
                </strong>

                <span id="sidebarRole">
                    member
                </span>

            </div>

        </div>

    </div>

</aside>

<main class="main">

<header class="topbar">

    <div style="display:flex;align-items:center;gap:10px">

        <button
            class="mobile-menu"
            id="mobileMenu"
            type="button"
        >
            ☰
        </button>

        <div class="page-title">
            Profile
        </div>

    </div>

</header>

<section class="content">

<div class="profile-card">

    <div class="cover"></div>

    <div class="profile-main">

        <div
            class="profile-avatar"
            id="profileAvatar"
        >
            U
        </div>

        <div
            class="profile-name"
            id="profileUsername"
        >
            User
        </div>

        <div
            class="profile-role"
            id="profileRole"
        >
            Member
        </div>

        <div class="info-grid">

            <div class="info-box">

                <span>
                    Username

                <strong id="infoUsername">

                </strong>

            <div class="info-box">

                <span>
                    Role
                </span>

                <strong id="infoRole">
                    -
                </strong>

            </div>

            <div class="info-box">

                <span>

                </span>

                <strong id="infoStatus">

                </strong>

            </div>

                        JPG, PNG, WEBP atau GIF • maksimal 5MB

                </button>

                id="saveProfile"

                id="statusBox"

</div>

<script>

const API_BASE =
    localStorage.getItem("apiBase") ||
    "https://api.legionteknologi.my.id";

const API_UPLOAD =
    `${API_BASE}/upload`;

const API_USERS =
    `${API_BASE}/api/users`;

const MAX_FILE_SIZE =
    5 * 1024 * 1024;

let currentUser = null;
let selectedFile = null;

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function formatRole(role){

    return String(role || "member")
        .replace(
            /\b\w/g,
            char => char.toUpperCase()
        );

}

function formatDate(date){

    if(!date){
        return "-";
    }

    const d = new Date(date);

    if(Number.isNaN(d.getTime())){
        return "-";
    }

    return d.toLocaleDateString(
        "id-ID",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    );

}

function getStoredUser(){

    const keys = [
        "user",
        "currentUser",
        "userData",
        "reycloud_user",
        "loginUser"
    ];

    for(const key of keys){

        const raw =
            localStorage.getItem(key);

        if(!raw){
            continue;
        }

        try{

            const data =
                JSON.parse(raw);

            if(
                data?.result?.user
            ){
                return data.result.user;
            }

            if(
                data?.user
            ){
                return data.user;
            }

            if(
                data?.username
            ){
                return data;
            }

        }catch(error){

            console.error(
                "Storage error:",
                error
            );

        }

    }

    return null;

}

function showStatus(
    message,
    type = ""
){

    const box =
        document.getElementById(
            "statusBox"
        );

    box.textContent =
        message;

    box.className =
        `status show ${type}`;

}

function updateUI(){

    if(!currentUser){
        return;
    }

    const username =
        String(
            currentUser.username ||
            "User"
        );

    const role =
        String(
            currentUser.role ||
            "member"
        );

    const avatar =
        currentUser.avatar ||
        "";

    document.getElementById(
        "profileUsername"
    ).textContent =
        username;

    document.getElementById(
        "profileRole"
    ).textContent =
        formatRole(role);

    document.getElementById(
        "infoUsername"
    ).textContent =
        username;

    document.getElementById(
        "infoRole"
    ).textContent =
        formatRole(role);

    document.getElementById(
        "infoStatus"
    ).textContent =
        currentUser.status ||
        "active";

    document.getElementById(
        "infoCreated"
    ).textContent =
        formatDate(
            currentUser.createdAt
        );

    document.getElementById(
        "sidebarUsername"
    ).textContent =
        username;

    document.getElementById(
        "sidebarRole"
    ).textContent =
        formatRole(role);

    setAvatar(
        "profileAvatar",
        avatar,
        username
    );

    setAvatar(
        "sidebarAvatar",
        avatar,
        username
    );

    setAvatar(
        "uploadPreview",
        avatar,
        username
    );

}

function setAvatar(
    elementId,
    avatar,
    username
){

    const element =
        document.getElementById(
            elementId
        );

    if(avatar){

        element.innerHTML = `
            <img
                src="${escapeHTML(avatar)}"
                alt="Avatar"
            >
        `;

    }else{

        element.textContent =
            username
                .charAt(0)
                .toUpperCase();

    }

}

async function loadUser(){

    const stored =
        getStoredUser();

    if(!stored?.username){

        alert(
            "Session login tidak ditemukan."
        );

        location.href =
            "index.html";

        return;

    }

    currentUser =
        stored;

    updateUI();

    try{

        const response =
            await fetch(
                `${API_USERS}/${encodeURIComponent(
                    stored.username
                )}`,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );

        const data =
            await response.json();

        if(
            !response.ok ||
            !data.status ||
            !data.result
        ){

            throw new Error(
                data.message ||
                "Gagal mengambil profile"
            );

        }

        currentUser =
            data.result;

        saveUserSession();

        updateUI();

    }catch(error){

        console.error(
            "[PROFILE LOAD]",
            error
        );

        showStatus(
            "Tidak dapat mengambil data terbaru dari server.",
            "error"
        );

    }

}

function saveUserSession(){

    localStorage.setItem(
        "user",
        JSON.stringify(
            currentUser
        )
    );

    localStorage.setItem(
        "userData",
        JSON.stringify(
            currentUser
        )
    );

    localStorage.setItem(
        "currentUser",
        JSON.stringify(
            currentUser
        )
    );

    localStorage.setItem(
        "reycloud_user",
        JSON.stringify(
            currentUser
        )
    );

}

document.getElementById(
    "chooseAvatar"
).addEventListener(
    "click",
    () => {

        document.getElementById(
            "avatarInput"
        ).click();

    }
);

document.getElementById(
    "avatarInput"
).addEventListener(
    "change",
    event => {

        const file =
            event.target.files?.[0];

        if(!file){
            return;
        }

        if(
            file.size >
            MAX_FILE_SIZE
        ){

            alert(
                "Ukuran foto maksimal 5MB."
            );

            event.target.value =
                "";

            return;

        }

        const allowed = [
            "image/jpeg",
            "image/png",
            "image/webp",
            "image/gif"
        ];

        if(
            !allowed.includes(
                file.type
            )
        ){

            alert(
                "Format foto harus JPG, PNG, WEBP atau GIF."
            );

            event.target.value =
                "";

            return;

        }

        selectedFile =
            file;

        const preview =
            document.getElementById(
                "uploadPreview"
            );

        preview.innerHTML = `
            <img
                src="${URL.createObjectURL(file)}"
                alt="Preview"
            >
        `;

        showStatus(
            "Foto siap diupload."
        );

    }
);

function extractUploadUrl(data){

    const candidates = [
        data?.url,
        data?.result?.url,
        data?.result?.fileUrl,
        data?.result?.urlFile,
        data?.result?.link,
        data?.data?.url,
        data?.file?.url
    ];

    return candidates.find(
        value =>
            typeof value === "string" &&
            /^https?:\/\//i.test(value)
    ) || "";

}

async function uploadAvatar(){

    if(!selectedFile){

        throw new Error(
            "Pilih foto terlebih dahulu."
        );

    }

    const formData =
        new FormData();

    formData.append(
        "file",
        selectedFile
    );

    const response =
        await fetch(
            API_UPLOAD,
            {
                method:"POST",
                body:formData
            }
        );

    const data =
        await response.json();

    if(
        !response.ok ||
        data.status === false
    ){

        throw new Error(
            data.message ||
            "Upload foto gagal."
        );

    }

    const url =
        extractUploadUrl(data);

    if(!url){

        console.log(
            "[UPLOAD]",
            data
        );

        throw new Error(
            "URL foto tidak ditemukan dari response upload."
        );

    }

    return url;

}

async function saveProfile(){

    if(!currentUser?.username){
        return;
    }

    if(!selectedFile){

        showStatus(
            "Pilih foto profil terlebih dahulu.",
            "error"
        );

        return;

    }

    const button =
        document.getElementById(
            "saveProfile"
        );

    button.disabled =
        true;

    button.textContent =
        "Mengupload...";

    try{

        showStatus(
            "Mengupload foto profil..."
        );

        const avatarUrl =
            await uploadAvatar();

        showStatus(
            "Menyimpan profile ke server..."
        );

        const response =
            await fetch(
                `${API_USERS}/${encodeURIComponent(
                    currentUser.username
                )}`,
                {
                    method:"PUT",

                    headers:{
                        "Content-Type":
                            "application/json",
                        "Accept":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            avatar:
                                avatarUrl
                        })
                }
            );

        const data =
            await response.json();

        if(
            !response.ok ||
            !data.status
        ){

            throw new Error(
                data.message ||
                "Gagal menyimpan profile."
            );

        }

        currentUser =
            data.result ||
            {
                ...currentUser,
                avatar:avatarUrl
            };

        currentUser.avatar =
            currentUser.avatar ||
            avatarUrl;

        saveUserSession();

        selectedFile =
            null;

        document.getElementById(
            "avatarInput"
        ).value =
            "";

        updateUI();

        showStatus(
            "Foto profil berhasil diperbarui.",
            "success"
        );

    }catch(error){

        console.error(
            "[PROFILE UPDATE]",
            error
        );

        showStatus(
            error.message ||
            "Gagal memperbarui profile.",
            "error"
        );

    }finally{

        button.disabled =
            false;

        button.textContent =
            "Simpan Foto Profil";

    }

}

document.getElementById(
    "saveProfile"
).addEventListener(
    "click",
    saveProfile
);

document.getElementById(
    "refreshAccount"
).addEventListener(
    "click",
    loadUser
);

document.getElementById(
    "mobileMenu"
).addEventListener(
    "click",
    () => {

        document
            .getElementById(
                "sidebar"
            )
            .classList
            .toggle(
                "open"
            );

    }
);

document.querySelectorAll(
    ".nav a"
).forEach(
    link => {

        link.addEventListener(
            "click",
            () => {

                document
                    .getElementById(
                        "sidebar"
                    )
                    .classList
                    .remove(
                        "open"
                    );

            }
        );

    }
);

document.getElementById(
    "logoutButton"
).addEventListener(
    "click",
    () => {

        [
            "user",
            "userData",
            "currentUser",
            "reycloud_user",
            "loginUser"
        ].forEach(
            key =>
                localStorage.removeItem(
                    key
                )
        );

        location.href =
