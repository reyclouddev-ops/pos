<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ReyCloud — Profile</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    min-height:100vh;
    background:#f7f8fa;
    color:#111827;
}

.app{
    min-height:100vh;
    display:flex;
}

.sidebar{
    width:250px;
    background:#fff;
    border-right:1px solid #e5e7eb;
    padding:22px 16px;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    z-index:20;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    padding:5px 10px 28px;
}

.logo-icon{
    width:36px;
    height:36px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#111827;
    color:#fff;
    font-weight:800;
}

.logo-text{
    font-size:18px;
    font-weight:800;
    letter-spacing:-.5px;
}

.logo-text span{
    color:#6b7280;
}

.nav-title{
    font-size:11px;
    font-weight:700;
    color:#9ca3af;
    padding:0 10px;
    margin:8px 0 10px;
    text-transform:uppercase;
    letter-spacing:.08em;
}

.nav{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.nav a{
    text-decoration:none;
    color:#6b7280;
    padding:11px 12px;
    border-radius:9px;
    display:flex;
    align-items:center;
    gap:11px;
    font-size:14px;
    font-weight:600;
    transition:.2s;
}

.nav a:hover{
    background:#f3f4f6;
    color:#111827;
}

.nav a.active{
    background:#111827;
    color:#fff;
}

.sidebar-user{
    position:absolute;
    left:16px;
    right:16px;
    bottom:18px;
    border-top:1px solid #e5e7eb;
    padding-top:15px;
}

.user-mini{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar-mini{
    width:36px;
    height:36px;
    border-radius:50%;
    background:#111827;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:13px;
    overflow:hidden;
}

.avatar-mini img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.user-info{
    min-width:0;
}

.user-info strong{
    display:block;
    font-size:13px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.user-info span{
    display:block;
    color:#9ca3af;
    font-size:11px;
    margin-top:2px;
}

.main{
    width:calc(100% - 250px);
    margin-left:250px;
    min-height:100vh;
}

.topbar{
    height:68px;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(12px);
    border-bottom:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    position:sticky;
    top:0;
    z-index:10;
}

.page-title{
    font-size:16px;
    font-weight:750;
}

.mobile-menu{
    display:none;
    border:0;
    background:#f3f4f6;
    width:35px;
    height:35px;
    border-radius:8px;
    cursor:pointer;
}

.content{
    max-width:950px;
    margin:auto;
    padding:30px;
}

.profile-header{
    background:#111827;
    color:white;
    border-radius:16px;
    padding:26px;
    margin-bottom:18px;
    position:relative;
    overflow:hidden;
}

.profile-header::before{
    content:"";
    position:absolute;
    width:250px;
    height:250px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:50%;
    right:-80px;
    top:-130px;
}

.profile-header::after{
    content:"";
    position:absolute;
    width:150px;
    height:150px;
    border:1px solid rgba(255,255,255,.06);
    border-radius:50%;
    right:60px;
    bottom:-110px;
}

.profile-header h1,
.profile-header p{
    position:relative;
    z-index:1;
}

.profile-header h1{
    font-size:25px;
    letter-spacing:-.7px;
}

.profile-header p{
    color:#9ca3af;
    font-size:13px;
    margin-top:7px;
}

.profile-card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:16px;
    overflow:hidden;
}

.profile-top{
    padding:28px;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    gap:25px;
}

.profile-avatar-wrap{
    position:relative;
    width:110px;
    height:110px;
    flex:0 0 110px;
}

.profile-avatar{
    width:110px;
    height:110px;
    border-radius:50%;
    background:#111827;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    font-weight:800;
    overflow:hidden;
    border:4px solid #f3f4f6;
}

.profile-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.camera-btn{
    position:absolute;
    right:0;
    bottom:0;
    width:34px;
    height:34px;
    border-radius:50%;
    border:3px solid #fff;
    background:#111827;
    color:#fff;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
}

.profile-main{
    min-width:0;
}

.profile-main h2{
    font-size:21px;
    font-weight:800;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.profile-main p{
    color:#9ca3af;
    font-size:13px;
    margin-top:5px;
}

.role-badge{
    display:inline-flex;
    margin-top:10px;
    padding:5px 10px;
    background:#f3f4f6;
    color:#4b5563;
    border-radius:20px;
    font-size:11px;
    font-weight:700;
}

.profile-body{
    padding:25px;
}

.section-title{
    font-size:14px;
    font-weight:800;
    margin-bottom:15px;
}

.info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.info-box{
    border:1px solid #e5e7eb;
    border-radius:11px;
    padding:14px;
    background:#fafafa;
}

.info-box label{
    display:block;
    color:#9ca3af;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.06em;
    font-weight:700;
    margin-bottom:6px;
}

.info-box strong{
    display:block;
    font-size:13px;
    color:#374151;
    word-break:break-word;
}

.upload-area{
    margin-top:25px;
    border-top:1px solid #e5e7eb;
    padding-top:25px;
}

.file-box{
    border:1px dashed #d1d5db;
    border-radius:12px;
    padding:22px;
    text-align:center;
    background:#fafafa;
    cursor:pointer;
    transition:.2s;
}

.file-box:hover{
    background:#f3f4f6;
    border-color:#9ca3af;
}

.file-box strong{
    display:block;
    font-size:13px;
    color:#374151;
}

.file-box span{
    display:block;
    font-size:11px;
    color:#9ca3af;
    margin-top:5px;
}

#fileInput{
    display:none;
}

.preview{
    display:none;
    margin-top:15px;
    padding:12px;
    border:1px solid #e5e7eb;
    border-radius:11px;
    background:#fff;
}

.preview img{
    width:100%;
    max-height:250px;
    object-fit:contain;
    border-radius:8px;
}

.preview-name{
    margin-top:8px;
    color:#6b7280;
    font-size:11px;
    word-break:break-all;
}

.actions{
    display:flex;
    gap:9px;
    margin-top:15px;
}

.btn{
    border:0;
    border-radius:9px;
    padding:11px 15px;
    cursor:pointer;
    font-size:12px;
    font-weight:700;
    transition:.2s;
}

.btn-primary{
    background:#111827;
    color:#fff;
}

.btn-primary:hover{
    background:#374151;
}

.btn-secondary{
    background:#f3f4f6;
    color:#374151;
}

.btn-secondary:hover{
    background:#e5e7eb;
}

.btn-danger{
    background:#fee2e2;
    color:#b91c1c;
}

.btn-danger:hover{
    background:#fecaca;
}

.btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.upload-status{
    display:none;
    margin-top:12px;
    padding:11px 13px;
    border-radius:9px;
    font-size:12px;
}

.upload-status.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.upload-status.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.upload-status.loading{
    display:block;
    background:#f3f4f6;
    color:#4b5563;
}

@media(max-width:800px){

    .sidebar{
        transform:translateX(-100%);
        transition:.25s;
        box-shadow:10px 0 30px rgba(0,0,0,.08);
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .main{
        width:100%;
        margin-left:0;
    }

    .mobile-menu{
        display:block;
    }

    .topbar{
        padding:0 15px;
    }

    .content{
        padding:15px;
    }
}

@media(max-width:600px){

    .profile-top{
        padding:22px;
        flex-direction:column;
        text-align:center;
    }

    .profile-main h2{
        max-width:280px;
    }

    .info-grid{
        grid-template-columns:1fr;
    }

    .profile-body{
        padding:20px;
    }

    .actions{
        flex-direction:column;
    }

    .btn{
        width:100%;
    }
}

@media(max-width:480px){

    .content{
        padding:10px;
    }

    .profile-header{
        border-radius:13px;
        padding:21px;
    }

    .profile-header h1{
        font-size:21px;
    }

    .profile-card{
        border-radius:13px;
    }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">

    <div class="logo">
        <div class="logo-icon">R</div>

        <div class="logo-text">
            ReyCloud <span>Panel</span>
        </div>
    </div>

    <div class="nav-title">
        Menu
    </div>

    <nav class="nav">

        <a href="dashboard.html">
            <span>⌂</span>
            Dashboard
        </a>

        <a href="cpanel.html">
            <span>▣</span>
            Create Panel
        </a>

        <a href="cadmin.html">
            <span>♙</span>
            Create Admin
        </a>

        <a href="chat.html">
            <span>◉</span>
            Public Chat
        </a>

        <a href="profile.html" class="active">
            <span>●</span>

        </a>

    </nav>

    <div class="sidebar-user">

        <div class="user-mini">

            <div class="avatar-mini" id="sidebarAvatar">

            </div>

                    User
                </strong>

                <span id="sidebarRole">
                    member
                </span>

            </div>

        </div>

</aside>


<main class="main">

<header class="topbar">

    <div style="
        display:flex;
        align-items:center;
        gap:10px
    ">

        <button
            class="mobile-menu"
            id="mobileMenu"
            type="button"
        >
            ☰
        </button>

        <div class="page-title">
            Profile
        </div>

    </div>

</header>


<section class="content">

    <div class="profile-header">

        <h1>
            👤 My Profile
        </h1>

        <p>
            Kelola informasi dan foto profil akun ReyCloud kamu.
        </p>

    <div class="profile-card">

                </div>

                </button>

            <div class="profile-main">

                <h2 id="profileUsername">

                </h2>

                </p>

                    class="role-badge"

        <div class="profile-body">

            <div class="section-title">

                <div class="info-box">

                    <label>

                    </label>

                    <strong id="infoUsername">

                    </strong>

                <div class="info-box">

                    <strong id="infoRole">

                    </strong>

                </div>

                <div class="info-box">

                    <label>
                        Status
                    </label>

                    <strong id="infoStatus">
                        Active
                    </strong>

                </div>

                        id="cancelBtn"
                        type="button"

                        Batal
                    </button>

                    <button
                        class="btn btn-danger"
                        id="removeBtn"
                        type="button"
                    >
                        🗑️ Hapus Foto

                    class="upload-status"
                    id="uploadStatus"
                ></div>

        </div>

</section>

</main>

</div>


<script>

const API_UPLOAD =
    "https://api.legionteknologi.my.id/upload";

let currentUser = null;
let selectedFile = null;
let previewObjectUrl = null;


/* =========================
   USER STORAGE
========================= */

function getUser(){

    const keys = [
        "user",
        "currentUser",
        "reycloud_user",
        "loginUser"
    ];

    for(const key of keys){

        try{

            const raw =
                localStorage.getItem(key);

            if(!raw){
                continue;
            }

            const parsed =
                JSON.parse(raw);

            if(
                parsed &&
                parsed.result &&
                parsed.result.user
            ){
                return parsed.result.user;
            }

            if(
                parsed &&
                parsed.user
            ){
                return parsed.user;
            }

            if(
                parsed &&
                parsed.username
            ){
                return parsed;
            }

        }catch(error){

            console.error(
                "[STORAGE]",
                error
            );

        }

    }

    return null;
}


/* =========================
   FORMAT
========================= */

function formatRole(role){

    return String(
        role || "member"
    )
    .replace(
        /\b\w/g,
        char =>
            char.toUpperCase()
    );
}


/* =========================
   STATUS
========================= */

function showStatus(
    message,
    type
){

    const box =
        document.getElementById(
            "uploadStatus"
        );

    box.textContent =
        message;

    box.className =
        `upload-status ${type}`;

}


/* =========================
   AVATAR
========================= */

function getAvatarUrl(){

    if(!currentUser){
        return "";
    }

    return (
        currentUser.avatar ||
        currentUser.avatarUrl ||
        currentUser.photo ||
        currentUser.photoUrl ||
        localStorage.getItem(
            `avatar_${currentUser.username}`
        ) ||
        ""
    );
}


function renderAvatar(){

    if(!currentUser){
        return;
    }

    const username =
        String(
            currentUser.username ||
            "User"
        ).trim();

    const initial =
        username
            .charAt(0)
            .toUpperCase();

    const avatarUrl =
        getAvatarUrl();

    const profileAvatar =
        document.getElementById(
            "profileAvatar"
        );

    const sidebarAvatar =
        document.getElementById(
            "sidebarAvatar"
        );

    if(avatarUrl){

        profileAvatar.innerHTML =
            `<img
                src="${escapeAttr(avatarUrl)}"
                alt="Avatar"
                onerror="this.parentElement.textContent='${escapeAttr(initial)}'"
            >`;

        sidebarAvatar.innerHTML =
            `<img
                src="${escapeAttr(avatarUrl)}"
                alt="Avatar"
            >`;

        document.getElementById(
            "infoAvatar"
        ).textContent =
            "Custom";

    }else{

        profileAvatar.textContent =
            initial;

        sidebarAvatar.textContent =
            initial;

        document.getElementById(
            "infoAvatar"
        ).textContent =
            "Default";
    }
}


function escapeAttr(value){

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    );
}


/* =========================
   USER SETUP
========================= */

function setupUser(){

    currentUser =
        getUser();

    if(!currentUser){

        alert(
            "Session login tidak ditemukan. Silakan login terlebih dahulu."
        );

        window.location.href =
            "index.html";

        return false;
    }

    const username =
        String(
            currentUser.username ||
            "User"
        ).trim();

    const role =
        String(
            currentUser.role ||
            "member"
        ).trim();

    document.getElementById(
        "profileUsername"
    ).textContent =
        username;

    document.getElementById(
        "profileSubtitle"
    ).textContent =
        `${formatRole(role)} ReyCloud User`;

    document.getElementById(
        "profileRole"
    ).textContent =
        formatRole(role);

    document.getElementById(
        "infoUsername"
    ).textContent =
        username;

    document.getElementById(
        "infoRole"
    ).textContent =
        formatRole(role);

    document.getElementById(
        "infoStatus"
    ).textContent =
        currentUser.status ||
        "Active";

    document.getElementById(
        "sidebarUsername"
    ).textContent =
        username;

    document.getElementById(
        "sidebarRole"
    ).textContent =
        formatRole(role);

    renderAvatar();

    return true;
}


/* =========================
   FILE SELECT
========================= */

document.getElementById(
    "fileInput"
).addEventListener(
    "change",
    event => {

        const file =
            event.target.files?.[0];

        if(!file){
            return;
        }

        const allowed = [
            "image/jpeg",
            "image/png",
            "image/webp"
        ];

        if(
            !allowed.includes(
                file.type
            )
        ){

            showStatus(
                "Format foto harus JPG, JPEG, PNG atau WEBP.",
                "error"
            );

            event.target.value =
                "";

            return;
        }

        if(
            file.size >
            5 * 1024 * 1024
        ){

            showStatus(
                "Ukuran foto maksimal 5MB.",
                "error"
            );

            event.target.value =
                "";

            return;
        }

        selectedFile =
            file;

        if(previewObjectUrl){

            URL.revokeObjectURL(
                previewObjectUrl
            );
        }

        previewObjectUrl =
            URL.createObjectURL(
                file
            );

        document.getElementById(
            "previewImage"
        ).src =
            previewObjectUrl;

        document.getElementById(
            "previewName"
        ).textContent =
            `${file.name} • ${formatSize(file.size)}`;

        document.getElementById(
            "preview"
        ).style.display =
            "block";

        document.getElementById(
            "uploadBtn"
        ).disabled =
            false;

        showStatus(
            "Foto siap di-upload.",
            "loading"
        );

    }
);


/* =========================
   FORMAT SIZE
========================= */

function formatSize(bytes){

    if(
        bytes <
        1024
    ){
        return `${bytes} B`;
    }

    if(
        bytes <
        1024 * 1024
    ){
        return `${(
            bytes / 1024
        ).toFixed(1)} KB`;
    }

    return `${(
        bytes /
        (1024 * 1024)
    ).toFixed(2)} MB`;
}


/* =========================
   UPLOAD
========================= */

document.getElementById(
    "uploadBtn"
).addEventListener(
    "click",
    uploadAvatar
);


async function uploadAvatar(){

    if(!selectedFile){

        showStatus(
            "Pilih foto terlebih dahulu.",
            "error"
        );

        return;
    }

    if(!currentUser?.username){

        showStatus(
            "Username tidak ditemukan.",
            "error"
        );

        return;
    }

    const button =
        document.getElementById(
            "uploadBtn"
        );

    button.disabled =
        true;

    showStatus(
        "Sedang meng-upload foto...",
        "loading"
    );

    try{

        const formData =
            new FormData();

        formData.append(
            "file",
            selectedFile
        );

        formData.append(
            "username",
            currentUser.username
        );

        const response =
            await fetch(
                API_UPLOAD,
                {
                    method:"POST",
                    body:formData
                }
            );

        let data;

        try{

            data =
                await response.json();

        }catch{

            throw new Error(
                `Response upload tidak valid (${response.status})`
            );

        }

        if(
            !response.ok
        ){

            throw new Error(
                data?.message ||
                `Upload gagal (${response.status})`
            );
        }

        if(
            data?.status === false
        ){

            throw new Error(
                data.message ||
                "Upload gagal."
            );
        }

        const avatarUrl =
            extractUrl(data);

        if(!avatarUrl){

            throw new Error(
                "Upload berhasil tetapi URL foto tidak ditemukan dari response API."
            );
        }

        saveAvatar(
            avatarUrl
        );

        showStatus(
            "✅ Foto profil berhasil diperbarui!",
            "success"
        );

        selectedFile =
            null;

        document.getElementById(
            "fileInput"
        ).value =
            "";

        document.getElementById(
            "uploadBtn"
        ).disabled =
            true;

        renderAvatar();

    }catch(error){

        console.error(
            "[AVATAR UPLOAD]",
            error
        );

        showStatus(
            error.message ||
            "Gagal meng-upload foto.",
            "error"
        );

        button.disabled =
            false;
    }
}


/* =========================
   EXTRACT URL
========================= */

function extractUrl(data){

    const candidates = [

        data?.url,

        data?.result?.url,

        data?.result?.fileUrl,

        data?.result?.imageUrl,

        data?.result?.link,

        data?.data?.url,

        data?.data?.fileUrl,

        data?.data?.imageUrl,

        data?.data?.link
    ];

    for(
        const value of candidates
    ){

        if(
            typeof value === "string" &&
            /^https?:\/\//i.test(value)
        ){

            return value;
        }

    }

    return "";
}


/* =========================
   SAVE AVATAR
========================= */

function saveAvatar(
    avatarUrl
){

    if(!currentUser?.username){
        return;
    }

    currentUser.avatar =
        avatarUrl;

    const username =
        currentUser.username;

    localStorage.setItem(
        `avatar_${username}`,
        avatarUrl
    );

    const keys = [
        "user",
        "currentUser",
        "reycloud_user",
        "loginUser"
    ];

    for(
        const key of keys
    ){

        try{

            const raw =
                localStorage.getItem(
                    key
                );

            if(!raw){
                continue;
            }

            const parsed =
                JSON.parse(raw);

            if(
                parsed?.result?.user
            ){

                parsed.result.user.avatar =
                    avatarUrl;

                localStorage.setItem(
                    key,
                    JSON.stringify(parsed)
                );

                continue;
            }

            if(parsed?.user){

                parsed.user.avatar =
                    avatarUrl;

                localStorage.setItem(
                    key,
                    JSON.stringify(parsed)
                );

                continue;
            }

            if(parsed?.username){

                parsed.avatar =
                    avatarUrl;

                localStorage.setItem(
                    key,
                    JSON.stringify(parsed)
                );
            }

        }catch(error){

            console.warn(
                "[SAVE USER]",
                error
            );

        }

    }

}
