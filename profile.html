<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ReyCloud — Profile</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    min-height:100vh;
    background:#f7f8fa;
    color:#111827;
}

button,input,textarea{
    font-family:inherit;
}

.app{
    min-height:100vh;
    display:flex;
}

.sidebar{
    width:250px;
    background:#fff;
    border-right:1px solid #e5e7eb;
    padding:22px 16px;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    z-index:50;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    padding:5px 10px 28px;
}

.logo-icon{
    width:36px;
    height:36px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#111827;
    color:#fff;
    font-weight:800;
}

.logo-text{
    font-size:18px;
    font-weight:800;
}

.logo-text span{
    color:#6b7280;
}

.nav-title{
    font-size:11px;
    font-weight:700;
    color:#9ca3af;
    padding:0 10px;
    margin:8px 0 10px;
    text-transform:uppercase;
    letter-spacing:.08em;
}

.nav{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.nav a{
    text-decoration:none;
    color:#6b7280;
    padding:11px 12px;
    border-radius:9px;
    display:flex;
    align-items:center;
    gap:11px;
    font-size:14px;
    font-weight:600;
}

.nav a:hover{
    background:#f3f4f6;
    color:#111827;
}

.nav a.active{
    background:#111827;
    color:#fff;
}

.sidebar-user{
    position:absolute;
    left:16px;
    right:16px;
    bottom:18px;
    border-top:1px solid #e5e7eb;
    padding-top:15px;
}

.user-mini{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar-mini{
    width:36px;
    height:36px;
    border-radius:50%;
    background:#111827;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    overflow:hidden;
}

.avatar-mini img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.user-info{
    min-width:0;
}

.user-info strong{
    display:block;
    font-size:13px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.user-info span{
    display:block;
    color:#9ca3af;
    font-size:11px;
    margin-top:2px;
}

.main{
    width:calc(100% - 250px);
    margin-left:250px;
    min-height:100vh;
}

.topbar{
    height:68px;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(12px);
    border-bottom:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    position:sticky;
    top:0;
    z-index:20;
}

.page-title{
    font-size:16px;
    font-weight:750;
}

.mobile-menu{
    display:none;
    border:0;
    background:#f3f4f6;
    width:35px;
    height:35px;
    border-radius:8px;
}

.content{
    max-width:900px;
    margin:auto;
    padding:30px;
}

.profile-header{
    background:#111827;
    color:#fff;
    border-radius:16px;
    padding:27px;
    margin-bottom:18px;
}

.profile-header h1{
    font-size:25px;
}

.profile-header p{
    color:#9ca3af;
    font-size:13px;
    margin-top:7px;
}

.profile-card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:16px;
    padding:25px;
}

.avatar-section{
    display:flex;
    align-items:center;
    gap:20px;
    padding-bottom:25px;
    border-bottom:1px solid #e5e7eb;
}

.profile-avatar{
    width:100px;
    height:100px;
    border-radius:50%;
    background:#111827;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    font-weight:800;
    overflow:hidden;
    flex-shrink:0;
}

.profile-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.avatar-info h2{
    font-size:18px;
}

.avatar-info p{
    color:#9ca3af;
    font-size:12px;
    margin-top:4px;
}

.upload-btn{
    margin-top:12px;
    border:1px solid #e5e7eb;
    background:#fff;
    color:#374151;
    border-radius:9px;
    padding:9px 13px;
    cursor:pointer;
    font-size:12px;
    font-weight:700;
}

.upload-btn:hover{
    background:#f3f4f6;
}

.form{
    padding-top:25px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    font-size:12px;
    font-weight:700;
    color:#374151;
    margin-bottom:7px;
}

.form-group input,
.form-group textarea{
    width:100%;
    border:1px solid #e5e7eb;
    background:#fafafa;
    outline:none;
    border-radius:10px;
    padding:12px;
    font-size:13px;
    color:#111827;
}

.form-group input:focus,
.form-group textarea:focus{
    background:#fff;
    border-color:#9ca3af;
}

.form-group input:disabled{
    color:#9ca3af;
}

.form-group textarea{
    resize:vertical;
    min-height:110px;
}

.counter{
    text-align:right;
    color:#9ca3af;
    font-size:10px;
    margin-top:5px;
}

.save-btn{
    width:100%;
    height:44px;
    border:0;
    border-radius:10px;
    background:#111827;
    color:#fff;
    cursor:pointer;
    font-size:13px;
    font-weight:750;
}

.save-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.status-message{
    display:none;
    padding:11px 13px;
    border-radius:9px;
    margin-bottom:17px;
    font-size:12px;
}

.status-message.show{
    display:block;
}

.status-message.success{
    background:#ecfdf5;
    color:#047857;
}

.status-message.error{
    background:#fef2f2;
    color:#b91c1c;
}

.info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:20px;
}

.info-box{
    background:#f9fafb;
    border:1px solid #f0f1f3;
    border-radius:10px;
    padding:12px;
}

.info-box strong{
    display:block;
    font-size:13px;
}

.info-box span{
    display:block;
    color:#9ca3af;
    font-size:10px;
    margin-top:3px;
}

@media(max-width:800px){

    .sidebar{
        transform:translateX(-100%);
        transition:.25s;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .main{
        width:100%;
        margin-left:0;
    }

    .mobile-menu{
        display:block;
    }

    .topbar{
        padding:0 15px;
    }

    .content{
        padding:15px;
    }
}

@media(max-width:500px){

    .content{
        padding:10px;
    }

    .profile-card{
        padding:18px;
    }

    .avatar-section{
        flex-direction:column;
        text-align:center;
    }

    .info-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">

    <div class="logo">
        <div class="logo-icon">R</div>
        <div class="logo-text">
            ReyCloud <span>Panel</span>
        </div>
    </div>

    <div class="nav-title">
        Main
    </div>

    <nav class="nav">

        <a href="dashboard.html">
            <span>⌂</span>
            Dashboard
        </a>

        <a href="profile.html" class="active">
            <span>◉</span>
            Profile
        </a>

        <a href="cpanel.html">
            <span>▣</span>
            Create Panel
        </a>

        <a href="cadmin.html">
            <span>♙</span>
            Create Admin
        </a>

        <a href="chat.html">
            <span>☁</span>
            Public Chat
        </a>

        <a href="privatechat.html">
            <span>✉</span>
            Private Chat
        </a>

    </nav>

    <div class="nav-title">
        Account
    </div>

    <nav class="nav">

        <a href="javascript:void(0)" id="logout">
            <span>↪</span>
            Logout
        </a>

    </nav>

    <div class="sidebar-user">

        <div class="user-mini">

            <div class="avatar-mini" id="miniAvatar">
                U
            </div>

            <div class="user-info">
                <strong id="miniUsername">
                    User
                </strong>

                <span id="miniRole">
                    member
                </span>
            </div>

        </div>

    </div>

</aside>

<main class="main">

<header class="topbar">

    <div style="display:flex;align-items:center;gap:10px">

        <button
            class="mobile-menu"
            id="mobileMenu"
        >
            ☰
        </button>

        <div class="page-title">
            Profile
        </div>

    </div>

</header>

<section class="content">

<div class="profile-header">

    <h1>
        👤 My Profile
    </h1>

    <p>
        Kelola avatar dan informasi profile kamu.
    </p>

</div>

<div class="profile-card">

<div
    class="status-message"
    id="statusMessage"
></div>

<div class="avatar-section">

    <div
        class="profile-avatar"
        id="profileAvatar"
    >
        U
    </div>

    <div class="avatar-info">

        <h2 id="profileName">
            User
        </h2>

        <p id="profileRole">
            member
        </p>

        <input
            type="file"
            id="avatarInput"
            accept="image/jpeg,image/png,image/webp,image/gif"
            hidden
        >

        <button
            class="upload-btn"
            id="uploadBtn"
            type="button"
        >
            🖼️ Pilih Avatar
        </button>

    </div>

</div>

<div class="form">

    <div class="form-group">

        <label>
            Username
        </label>

        <input
            type="text"
            id="username"
            disabled
        >

    </div>

    <div class="form-group">

        <label>
            Bio
        </label>

        <textarea
            id="bio"
            maxlength="300"
            placeholder="Tulis bio kamu..."
        ></textarea>

        <div class="counter">
            <span id="bioCount">0</span>/300
        </div>

    </div>

    <button
        class="save-btn"
        id="saveBtn"
        type="button"
    >
        Simpan Profile
    </button>

    <div class="info-grid">

        <div class="info-box">
            <strong id="infoRole">
                -
            </strong>
            <span>
                Role
            </span>
        </div>

        <div class="info-box">
            <strong id="infoStatus">
                -
            </strong>
            <span>
                Status
            </span>
        </div>

        <div class="info-box">
            <strong id="infoCreated">
                -
            </strong>
            <span>
                Bergabung
            </span>
        </div>

        <div class="info-box">
            <strong id="infoDuration">
                -
            </strong>
            <span>
                Durasi
            </span>
        </div>

    </div>

</div>

</div>

</section>

</main>

</div>

<script>

const API_BASE =
    localStorage.getItem("apiBase") ||
    "https://api.legionteknologi.my.id";

let currentUser = null;
let selectedAvatar = null;

const MAX_AVATAR_SIZE =
    5 * 1024 * 1024;

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function getUser(){

    const keys = [
        "user",
        "currentUser",
        "userData",
        "reycloud_user",
        "loginUser"
    ];

    for(const key of keys){

        const raw =
            localStorage.getItem(key);

        if(!raw){
            continue;
        }

        try{

            const data =
                JSON.parse(raw);

            if(
                data &&
                data.result &&
                data.result.user
            ){
                return data.result.user;
            }

            if(
                data &&
                data.user
            ){
                return data.user;
            }

            if(
                data &&
                data.username
            ){
                return data;
            }

        }catch(error){
            console.error(error);
        }
    }

    return null;
}

function saveLocalUser(user){

    const json =
        JSON.stringify(user);

    localStorage.setItem(
        "user",
        json
    );

    localStorage.setItem(
        "userData",
        json
    );

    localStorage.setItem(
        "currentUser",
        json
    );

    localStorage.setItem(
        "reycloud_user",
        json
    );

    localStorage.setItem(
        "loginUser",
        json
    );
}

function formatRole(role){

    return String(
        role || "member"
    ).replace(
        /\b\w/g,
        char =>
            char.toUpperCase()
    );
}

function formatDate(value){

    if(!value){
        return "-";
    }

    const date =
        new Date(value);

    if(
        Number.isNaN(
            date.getTime()
        )
    ){
        return "-";
    }

    return date.toLocaleDateString(
        "id-ID",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    );
}

function showStatus(
    message,
    type
){

    const box =
        document.getElementById(
            "statusMessage"
        );

    box.textContent =
        message;

    box.className =
        `status-message show ${type}`;

}

function renderUser(user){

    currentUser =
        user;

    const username =
        String(
            user.username ||
            "User"
        );

    const role =
        String(
            user.role ||
            "member"
        );

    document.getElementById(
        "profileName"
    ).textContent =
        username;

    document.getElementById(
        "profileRole"
    ).textContent =
        formatRole(role);

    document.getElementById(
        "username"
    ).value =
        username;

    document.getElementById(
        "bio"
    ).value =
        user.bio || "";

    updateBioCount();

    document.getElementById(
        "infoRole"
    ).textContent =
        formatRole(role);

    document.getElementById(
        "infoStatus"
    ).textContent =
        user.status || "active";

    document.getElementById(
        "infoCreated"
    ).textContent =
        formatDate(
            user.createdAt
        );

    document.getElementById(
        "infoDuration"
    ).textContent =
        user.duration || "-";

    document.getElementById(
        "miniUsername"
    ).textContent =
        username;

    document.getElementById(
        "miniRole"
    ).textContent =
        formatRole(role);

    renderAvatar(
        user.avatar,
        username
    );
}

function renderAvatar(
    avatar,
    username
){

    const profile =
        document.getElementById(
            "profileAvatar"
        );

    const mini =
        document.getElementById(
            "miniAvatar"
        );

    if(avatar){

        const safe =
            escapeHTML(avatar);

        profile.innerHTML = `
            <img
                src="${safe}"
                alt="Avatar"
            >
        `;

        mini.innerHTML = `
            <img
                src="${safe}"
                alt="Avatar"
            >
        `;

    }else{

        const initial =
            String(
                username || "U"
            )
            .charAt(0)
            .toUpperCase();

        profile.textContent =
            initial;

        mini.textContent =
            initial;
    }
}

async function loadProfile(){

    const localUser =
        getUser();

    if(!localUser?.username){

        window.location.href =
            "index.html";

        return;
    }

    try{

        const response =
            await fetch(
                `${API_BASE}/api/users/${encodeURIComponent(
                    localUser.username
                )}`,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );

        const data =
            await response.json();

        if(
            !response.ok ||
            !data.status ||
            !data.result
        ){

            throw new Error(
                data.message ||
                "Gagal mengambil profile"
            );
        }

        renderUser(
            data.result
        );

        saveLocalUser(
            data.result
        );

    }catch(error){

        console.error(
            "[PROFILE GET]",
            error
        );

        renderUser(
            localUser
        );

        showStatus(
            "Gagal mengambil data terbaru dari server.",
            "error"
        );
    }
}

function updateBioCount(){

    const bio =
        document.getElementById(
            "bio"
        );

    document.getElementById(
        "bioCount"
    ).textContent =
        bio.value.length;
}

document.getElementById(
    "bio"
).addEventListener(
    "input",
    updateBioCount
);

document.getElementById(
    "uploadBtn"
).addEventListener(
    "click",
    () => {

        document.getElementById(
            "avatarInput"
        ).click();

    }
);

document.getElementById(
    "avatarInput"
).addEventListener(
    "change",
    event => {

        const file =
            event.target.files?.[0];

        if(!file){
            return;
        }

        if(
            file.size >
            MAX_AVATAR_SIZE
        ){

            showStatus(
                "Avatar maksimal 5MB.",
                "error"
            );

            event.target.value =
                "";

            return;
        }

        const allowed = [
            "image/jpeg",
            "image/png",
            "image/webp",
            "image/gif"
        ];

        if(
            !allowed.includes(
                file.type
            )
        ){

            showStatus(
                "Format avatar harus JPG, PNG, WEBP, atau GIF.",
                "error"
            );

            event.target.value =
                "";

            return;
        }

        selectedAvatar =
            file;

        const url =
            URL.createObjectURL(
                file
            );

        renderAvatar(
            url,
            currentUser?.username
        );

        showStatus(
            "Avatar dipilih. Klik Simpan Profile untuk menyimpan.",
            "success"
        );
    }
);

function extractUploadUrl(data){

    const candidates = [
        data?.url,
        data?.result?.url,
        data?.result?.fileUrl,
        data?.result?.urlFile,
        data?.result?.link,
        data?.data?.url,
        data?.file?.url
    ];

    return candidates.find(
        value =>
            typeof value === "string" &&
            /^https?:\/\//i.test(value)
    ) || "";
}

async function uploadAvatar(file){

    const form =
        new FormData();

    form.append(
        "file",
        file
    );

    const response =
        await fetch(
            `${API_BASE}/upload`,
            {
                method:"POST",
                body:form
            }
        );

    const data =
        await response.json();

    if(
        !response.ok ||
        data.status === false
    ){

        throw new Error(
            data.message ||
            "Upload avatar gagal"
        );
    }

    const url =
        extractUploadUrl(
            data
        );

    if(!url){

        throw new Error(
            "URL avatar tidak ditemukan dari response upload."
        );
    }

    return url;
}

document.getElementById(
    "saveBtn"
).addEventListener(
    "click",
    saveProfile
);

async function saveProfile(){

    if(!currentUser?.username){
        return;
    }

    const button =
        document.getElementById(
            "saveBtn"
        );

    const bio =
        document.getElementById(
            "bio"
        ).value
        .trim();

    if(bio.length > 300){

        showStatus(
            "Bio maksimal 300 karakter.",
            "error"
        );

        return;
    }

    button.disabled =
        true;

    button.textContent =
        "Menyimpan...";

    try{

        let avatar =
            currentUser.avatar ||
            "";

        if(selectedAvatar){

            button.textContent =
                "Mengupload avatar...";

            avatar =
                await uploadAvatar(
                    selectedAvatar
                );
        }

        button.textContent =
            "Menyimpan profile...";

        const response =
            await fetch(
                `${API_BASE}/api/users/${encodeURIComponent(
                    currentUser.username
                )}/profile`,
                {
                    method:"PUT",
                    headers:{
                        "Content-Type":
                            "application/json",
                        "Accept":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            avatar,
                            bio
                        })
                }
            );

        const data =
            await response.json();

        if(
            !response.ok ||
            !data.status ||
            !data.result
        ){

            throw new Error(
                data.message ||
                "Gagal update profile"
            );
        }

        currentUser =
            data.result;

        saveLocalUser(
            currentUser
        );

        selectedAvatar =
            null;

        document.getElementById(
            "avatarInput"
        ).value =
            "";

        renderUser(
            currentUser
        );

        showStatus(
            "Profile berhasil diperbarui! ✅",
            "success"
        );

    }catch(error){

        console.error(
            "[PROFILE UPDATE]",
            error
        );

        showStatus(
            error.message ||
            "Gagal memperbarui profile.",
            "error"
        );

    }finally{

        button.disabled =
            false;

        button.textContent =
            "Simpan Profile";
    }
}

document.getElementById(
    "mobileMenu"
).addEventListener(
    "click",
    () => {

        document
            .getElementById(
                "sidebar"
            )
            .classList
            .toggle(
                "open"
            );
    }
);

document.querySelectorAll(
    ".nav a"
).forEach(
    link => {

        link.addEventListener(
            "click",
            () => {

                document
                    .getElementById(
                        "sidebar"
                    )
                    .classList
                    .remove(
                        "open"
                    );
            }
        );
    }
);

document.getElementById(
    "logout"
).addEventListener(
    "click",
    () => {

        [
            "user",
            "userData",
            "currentUser",
            "reycloud_user",
            "loginUser"
        ].forEach(
            key =>
                localStorage.removeItem(
                    key
                )
        );

        window.location.href =
            "index.html";
    }
);

loadProfile();

</script>

</body>
</html>
